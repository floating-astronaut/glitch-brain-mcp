server {
    listen 443 ssl http2;
    server_name brain.glitchexecutor.com;

    # Reuses *.glitchexecutor.com wildcard cert (same as mcp.glitchexecutor.com)
    ssl_certificate     /etc/letsencrypt/live/glitchexecutor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glitchexecutor.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable-HTTP / SSE
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name brain.glitchexecutor.com;
    return 301 https://$host$request_uri;
}
