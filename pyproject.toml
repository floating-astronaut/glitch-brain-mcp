[project]
name = "glitch-brain-mcp"
version = "0.1.0"
description = "Central memory brain for Glitch Grow AI agents. Multi-brand, multi-agent shared memory over Postgres, exposed via streamable-HTTP MCP."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  "mcp[cli]>=1.2",
  "uvicorn[standard]>=0.32",
  "starlette>=0.41",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "structlog>=24.4",
  "click>=8.1",
  "fastembed>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
glitch-brain-mcp = "glitch_brain_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glitch_brain_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
